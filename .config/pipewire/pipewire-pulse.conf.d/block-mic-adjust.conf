# Prevent Discord, Vesktop, WebRTC, and Electron apps from automatically
# reducing or changing the system microphone / source volume (Automatic Gain Control).
pulse.rules = [
    {
        matches = [
            { application.process.binary = "Discord" }
            { application.process.binary = "discord" }
            { application.process.binary = "vesktop" }
            { application.process.binary = "vesktop.bin" }
            { application.process.binary = "electron" }
            { application.process.binary = "chrome" }
            { application.process.binary = "chromium" }
            { application.process.binary = "brave" }
            { application.process.binary = "steam" }
            { application.process.binary = "steamwebhelper" }
            { application.name = "~.*([Dd]iscord|[Vv]esktop|[Ee]lectron|[Cc]hrome|[Cc]hromium|[Bb]rave|[Ww]ebRTC).*" }
            { application.process.binary = "~.*([Dd]iscord|[Vv]esktop|[Ee]lectron|[Cc]hrome|[Cc]hromium|[Bb]rave).*" }
            { application.id = "~.*([Dd]iscord|[Vv]esktop).*" }
        ]
        actions = {
            quirks = [ block-source-volume ]
        }
    }
]
