# ─── Catppuccin Sapphire Hyprlock Configuration ─────────────
# Matches Quickshell dark palette (#121213) with Sapphire accents (#89B4FA)

# BACKGROUND
background {
    monitor =
    path = $HOME/Pictures/wall.jpg
    blur_passes = 3
    blur_size = 6
    noise = 0.012
    contrast = 0.89
    brightness = 0.55
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# GENERAL SETTINGS
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
    immediate_render = true
}

# TIME (Large Clock)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = rgba(205, 214, 244, 1.0)
    font_size = 72
    font_family = Rowdies
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.45)
    shadow_boost = 1.2
    position = 0, 180
    halign = center
    valign = center
}

# DATE BADGE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(137, 180, 250, 1.0)
    font_size = 18
    font_family = Inter
    position = 0, 110
    halign = center
    valign = center
}

# USER GREETING
label {
    monitor =
    text = <span>Welcome back, <b>$USER</b></span>
    color = rgba(205, 214, 244, 0.85)
    font_size = 15
    font_family = Inter
    position = 0, 10
    halign = center
    valign = center
}

# PASSWORD INPUT FIELD
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.3
    dots_center = true
    rounding = 24

    outer_color = rgba(137, 180, 250, 0.75)
    inner_color = rgba(18, 18, 19, 0.75)
    font_color = rgba(205, 214, 244, 1.0)

    fade_on_empty = false
    placeholder_text = <span foreground="##cdd6f488"><i>󰌾  Enter password...</i></span>
    hide_input = false

    check_color = rgba(180, 190, 254, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)
    fail_text = <i>Authentication failed ($ATTEMPTS)</i>
    capslock_color = rgba(249, 226, 175, 1.0)

    position = 0, -60
    halign = center
    valign = center
}

# BATTERY / SYSTEM STATUS (Bottom Center)
label {
    monitor =
    text = cmd[update:5000] echo -e "󰁹 $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null)%   •   $(uptime -p | sed 's/up //')"
    color = rgba(137, 180, 250, 0.75)
    font_size = 12
    font_family = JetBrainsMono NF
    position = 0, 30
    halign = center
    valign = bottom
}
